name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  server:
    name: Backend + lobby tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/death-muffin/lobby/package-lock.json

      # The lobby needs ws + jsonwebtoken; the backend tests run on the repo-root install.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server/death-muffin/lobby

      - name: Repo hygiene (stale docs, references, retired terms)
        run: npm run hygiene

      - name: Shared rules tests
        run: npm run test:rules

      - name: Backend tests (auth, gathering, necro-progress)
        run: npm run test:server

      - name: Lobby tests
        run: npm test --prefix server/death-muffin/lobby

  godot:
    name: Godot client tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path godot --import

      # Suites that run from a clean checkout of tracked files (golden fixtures are committed) and finish quickly; the full set is
      # tools/godot/run-all-tests.sh (about 100 suites, too long for CI).
      # Each suite prints "N passed, M failed" and exits non-zero on any failure.
      - name: Godot suites
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"   # user:// state must not leak between suites
          rc=0
          for s in \
            audio/run.gd \
            audio_wire/run.gd \
            data/run.gd \
            front/run.gd \
            net/run.gd \
            loot_view/run.gd \
            hud/run.gd \
            corpses/run.gd \
            game_ui/run.gd \
            game/gather_run.gd \
            game/graphics_run.gd \
            game/labor_run.gd \
            game/acre_gold_run.gd \
            game/legion_gold_run.gd \
            game/offline_auto_run.gd \
            game/depths_builder_run.gd \
            game/autocombat_run.gd \
            sim/run.gd \
            fx/run.gd \
            dialogue/run.gd \
            gear/run.gd \
            ui_parity/run.gd \
            rules-core/run.gd \
            rules-combat/run.gd \
            rules-gathering/run.gd \
            rules-loot/run.gd \
            rules-loot/bag_save_run.gd \
            rules-progression/run.gd; do
            if timeout 300 ~/godot-bin/godot --headless --path godot --script "res://tests/$s"; then echo "OK   $s"; else echo "FAIL $s"; rc=1; fi
          done
          exit $rc
