name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # Every commit on main gets its own run, never cancelled, so each revision has a verdict to ship on; a newer push to a branch replaces its older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  # What the push changes against main (against the previous main on a push to main): only documents (Markdown, docs/) skip the game's
  # suites, and the verdict is the backend job's checks (hygiene included). Anything else, or a base that cannot be found, runs everything.
  scope:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      game: ${{ steps.s.outputs.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: s
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(git merge-base HEAD origin/main 2>/dev/null || true)
          [ "$base" != "$(git rev-parse HEAD)" ] || base="$BEFORE"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && ! git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "documents only since ${base:0:12}: the game's suites are skipped"; echo game=false >> "$GITHUB_OUTPUT"
          else echo game=true >> "$GITHUB_OUTPUT"; fi

  server:
    name: Backend + lobby tests
    needs: scope
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice), a move to make on purpose
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/death-muffin/lobby/package-lock.json

      # The lobby needs ws + jsonwebtoken; the backend tests run on the repo-root install.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server/death-muffin/lobby

      - name: Repo hygiene (stale docs, references, retired terms)
        run: npm run hygiene

      - name: Model budgets (triangles, materials, skeletons, clips)
        run: npm run check:models

      - name: Pictures (the kinds list, the picture builder, every ability has its own icon)
        run: node --test tools/pictures/*.test.mjs

      - name: Blender jobs (the kinds list, job checks, model rows, the merge into shipped models)
        run: node --test tools/blender/jobs.test.mjs

      - name: Shared rules tests
        run: npm run test:rules

      - name: Generated files are current (server rule bundles, armor sets; server/death-muffin/discord-agent/regen-godot.sh remakes them)
        run: |
          node tools/build-server-rules.mjs --check
          node tools/generate-armor-assets.mjs --check

      - name: Backend tests (auth, gathering, necro-progress)
        run: npm run test:server

      - name: Lobby tests
        run: npm test --prefix server/death-muffin/lobby

      - name: The game's setup (tools/check/prep.sh, on a throwaway repository)
        run: node --test tools/check/test/*.test.mjs

      # The Discord agent's own tests (about 220, a minute): they need git, zip/unzip and `unshare`. ubuntu-24.04 blocks unprivileged user
      # namespaces through AppArmor, so allow them first (this runner is thrown away after the job).
      - name: Discord agent tests
        if: needs.scope.outputs.game == 'true'   # a push of documents only cannot break them (about 2 minutes saved on each)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # the sandbox makes every mount read-only, then mounts a tmpfs over /tmp; libmount then fails to update its table in /run/mount
          # ("failed to update userspace mount table"), so keep the table in /dev/shm, which stays writable
          export LIBMOUNT_UTAB=/dev/shm/dm-mount-utab
          # The agent's tests expect the VPS's layout: install-runner.sh makes /home/ubuntu/death-muffin/deploy, and the sandbox tests try to write
          # the live folders the runner user owns there (they need most of them to exist: a sandbox that protects nothing must fail, not pass empty).
          sudo mkdir -p /home/ubuntu /var/www/death-muffin/{client,play,offline,preview} /opt/{crossworlds-bot,crossworlds-auth,muffincore} /game /game-staging
          sudo chown "$USER" /home/ubuntu /var/www/death-muffin /var/www/death-muffin/{client,play,offline,preview} /opt/{crossworlds-bot,crossworlds-auth,muffincore} /game /game-staging
          # zip/unzip (the preview packages) and Pillow (label-shot.py draws the labels on the pictures)
          python3 -c 'import PIL' 2>/dev/null && command -v zip >/dev/null && command -v unzip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip python3-pil; }
          node --test server/death-muffin/discord-agent/test/*.test.cjs

  # The game (client/, DECISIONS B49): its build products from the cache (or built), then every suite.
  client:
    name: Game client tests (${{ matrix.shard }}/6)
    needs: scope
    if: needs.scope.outputs.game == 'true'
    # The suites split in six by their recorded times (run-client-tests.sh --shard), six machines side by side; each takes the build products
    # from the cache, so a machine more costs about a minute of set-up, not the 14 minutes of building them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice), a move to make on purpose
    timeout-minutes: 60
    env:
      GODOT: /home/runner/godot-bin/godot
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      # The game's build products through its one setup (tools/check/prep.sh, tools/check/README.md): the combat core, Godot's import and the
      # crowd's bakes, each restored by its key (what it is made of) and built only when that changed; one folder per kind (DM_PREP_SLOTS).
      # The first shard saves what it had to build. godot-cpp (about 6 minutes) and scons are only needed when the combat core is rebuilt.
      - name: Cache keys
        id: keys
        run: bash tools/check/prep.sh --keys >> "$GITHUB_OUTPUT"

      - name: Restore the combat core
        id: core
        uses: actions/cache/restore@v4
        with:
          path: ~/ci-cache/core
          key: ${{ steps.keys.outputs.core }}

      - name: Restore Godot's import
        id: import
        uses: actions/cache/restore@v4
        with:
          path: ~/ci-cache/import
          key: ${{ steps.keys.outputs.import }}
          restore-keys: import-

      - name: Restore the crowd's bakes
        id: bake
        uses: actions/cache/restore@v4
        with:
          path: ~/ci-cache/bake
          key: ${{ steps.keys.outputs.bake }}

      - name: Cache godot-cpp
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/death-muffin/native-cache
          key: godot-cpp-${{ hashFiles('native/build.sh') }}-linux

      - name: Build tools
        if: steps.core.outputs.cache-hit != 'true'
        run: pip install --user scons

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare the game (tools/check/prep.sh)
        env:
          DM_PREP_SLOTS: /home/runner/ci-cache
        run: bash tools/check/prep.sh

      - name: Save the combat core
        if: matrix.shard == 1 && steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ci-cache/core
          key: ${{ steps.keys.outputs.core }}

      - name: Save Godot's import
        if: matrix.shard == 1 && steps.import.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ci-cache/import
          key: ${{ steps.keys.outputs.import }}

      - name: Save the crowd's bakes
        if: matrix.shard == 1 && steps.bake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ci-cache/bake
          key: ${{ steps.keys.outputs.bake }}

      # Every suite, three side by side (tools/rebuild/run-client-tests.sh: one line per suite, the slowest first, each failure (up to five) once more alone, exit 1 on failure).
      - name: Client suites
        run: bash tools/rebuild/run-client-tests.sh --jobs 3 --shard ${{ matrix.shard }}/6
