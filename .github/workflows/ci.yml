name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  server:
    name: Backend + lobby tests
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice), a move to make on purpose
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/death-muffin/lobby/package-lock.json

      # The lobby needs ws + jsonwebtoken; the backend tests run on the repo-root install.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server/death-muffin/lobby

      - name: Repo hygiene (stale docs, references, retired terms)
        run: npm run hygiene

      - name: Model budgets (triangles, materials, skeletons, clips)
        run: npm run check:models

      - name: Shared rules tests
        run: npm run test:rules

      - name: Backend tests (auth, gathering, necro-progress)
        run: npm run test:server

      - name: Lobby tests
        run: npm test --prefix server/death-muffin/lobby

  godot:
    name: Godot client tests
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice), a move to make on purpose
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path godot --import

      # The lobby/relay suites start the real lobby service (node + ws).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lobby dependencies
        run: npm ci --prefix server/death-muffin/lobby

      # Every suite, in parallel (tools/godot/run-all-tests.sh: one line per suite, retries a pool failure once alone, exit 1 on failure).
      - name: Godot suites
        run: GODOT=~/godot-bin/godot bash tools/godot/run-all-tests.sh --jobs 4

  # The game players run since launch day (client/, DECISIONS B49): the combat core is built (Linux), the project imported, the crowd baked, then every suite.
  client:
    name: Game client tests (client/)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice), a move to make on purpose
    timeout-minutes: 60
    env:
      GODOT: /home/runner/godot-bin/godot
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      # godot-cpp compiles once per pinned commit (about 6 minutes); native/build.sh keeps it in ~/death-muffin/native-cache.
      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: ~/death-muffin/native-cache
          key: godot-cpp-${{ hashFiles('native/build.sh') }}-linux

      - name: Build tools
        run: pip install --user scons

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lobby dependencies
        run: npm ci --prefix server/death-muffin/lobby

      - name: Combat core, import and core smoke
        run: bash client/setup.sh

      - name: Bake the crowd's models
        run: bash client/tools/bake_crowd.sh

      # Every suite, three side by side (tools/rebuild/run-client-tests.sh: one line per suite, retries up to three failures once alone, exit 1 on failure).
      - name: Client suites
        run: bash tools/rebuild/run-client-tests.sh --jobs 3
