# Include inside the muffindevelopment.com server block, next to the live /death-muffin/lobby/ and /death-muffin/test-api/ locations. NOT installed by this repo.
# The rebuilt client connects to  wss://muffindevelopment.com/death-muffin/test-lobby/  (DmConfig.LOBBY_URL); the trailing slash maps to the service root.
location = /death-muffin/test-lobby { return 301 /death-muffin/test-lobby/; }
location ^~ /death-muffin/test-lobby/ {
    proxy_pass http://127.0.0.1:5195/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;   # the service pings every 20 s, so idle-but-alive sockets stay open
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 128k;
}
