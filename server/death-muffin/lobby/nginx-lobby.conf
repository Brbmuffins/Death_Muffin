# Include inside the muffindevelopment.com server block (also mirrored in ../nginx-locations.conf). NOT installed by this repo.
# Clients connect to  wss://muffindevelopment.com/death-muffin/lobby/  (the trailing slash maps to the service root).
location = /death-muffin/lobby { return 301 /death-muffin/lobby/; }
location ^~ /death-muffin/lobby/ {
    proxy_pass http://127.0.0.1:5192/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;   # the service pings every 20 s, so idle-but-alive sockets stay open
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 128k;
}
