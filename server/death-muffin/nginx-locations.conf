# Mirror of the /death-muffin/ locations live in /etc/nginx/sites-available/muffindevelopment (muffindevelopment.com). NOT installed by this repo.
    location = /death-muffin { return 301 /death-muffin/; }
    location ^~ /death-muffin/api/ {
        proxy_pass http://127.0.0.1:5190/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /death-muffin/rt/socket.io/ (death-muffin-realtime :5191) retired 2026-10-09 with the web game.
    location = /death-muffin/lobby { return 301 /death-muffin/lobby/; }
    location ^~ /death-muffin/lobby/ {
        proxy_pass http://127.0.0.1:5192/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 128k;
    }
    location ^~ /death-muffin/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
