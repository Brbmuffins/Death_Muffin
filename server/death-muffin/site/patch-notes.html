<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060a" />
    <meta
      name="description"
      content="What changed in each Death Muffin release, in plain words."
    />
    <title>Death Muffin Patch Notes</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2307060a'/%3E%3Cpath d='M16 4v24M8 10l8-5 8 5M9 22l7 6 7-6M7 16h18' fill='none' stroke='%239b5cff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c6a4ff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="assets/covenant-bg.png" as="image" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body class="about-page patch-notes-page">
  <header class="site-nav">
    <a class="site-nav__brand" href="index.html"><span class="site-nav__mark" aria-hidden="true"></span><span>Death Muffin</span></a>
    <nav aria-label="Primary navigation">
      <a class="site-nav__link" href="about.html">About</a>
      <a class="site-nav__link" href="classes.html">Classes</a>
      <a class="site-nav__link" href="leaderboard.html">Leaderboard</a>
      <a class="site-nav__link" href="patch-notes.html" aria-current="page">Patch notes</a>
      <a class="site-nav__enter" href="index.html">Download</a>
    </nav>
  </header>
  <main class="about-section patch-notes-section">
    <div class="section-heading"><p class="eyebrow">What changed</p><h1>Patch notes</h1></div>
    <p id="patch-status" role="status">Reading the ledger…</p>
    <div id="patch-list"></div>
  </main>
  <style>
    .patch-release { margin: 0 0 28px; padding: 16px 20px; border: 1px solid rgba(198, 164, 255, 0.22); background: rgba(13, 11, 17, 0.82); border-radius: 6px; }
    .patch-release h2 { margin: 0 0 4px; font-family: var(--occult); font-weight: 400; font-size: 30px; color: var(--bone-bright); }
    .patch-release time { display: block; margin-bottom: 10px; color: var(--ember); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .patch-release ul { margin: 0; padding-left: 20px; }
    .patch-release li { margin: 0 0 8px; line-height: 1.5; color: var(--bone); }
  </style>
  <script>
    (async () => {
      const status = document.getElementById('patch-status');
      const list = document.getElementById('patch-list');
      try {
        const r = await fetch('play/patch-notes.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await r.json();
        const releases = data.releases || [];
        if (!releases.length) { status.textContent = 'No patch notes yet.'; return; }
        status.remove();
        for (const rel of releases) {
          const sec = document.createElement('section');
          sec.className = 'patch-release';
          const h = document.createElement('h2'); h.textContent = rel.title || 'Release';
          const t = document.createElement('time'); t.textContent = rel.date || ''; if (rel.date) t.dateTime = rel.date;
          const ul = document.createElement('ul');
          for (const item of rel.items || []) { const li = document.createElement('li'); li.textContent = item; ul.appendChild(li); }
          sec.append(h, t, ul);
          list.appendChild(sec);
        }
      } catch (e) {
        status.textContent = 'Patch notes could not be loaded right now.';
      }
    })();
  </script>
</body>
</html>
