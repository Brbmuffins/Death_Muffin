<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="Death Muffin — a dark fantasy action RPG. Farm the dead, raise your legion, push deeper." />
  <title>Death Muffin</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2307060a'/%3E%3Cpath d='M16 4v24M8 10l8-5 8 5M9 22l7 6 7-6M7 16h18' fill='none' stroke='%239b5cff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c6a4ff'/%3E%3C/svg%3E" />
  <style>
    /* Instant splash: paints from the HTML alone (placeholder, then the painted art), before any module loads. Shared with the in-game
       LoadVeil (src/ui/LoadVeil.ts) so page open -> login -> world is one continuous loading screen. Removed by src/ui/splash.ts. */
    html, body { background: #07060a; }
    .dm-splash { position: fixed; inset: 0; z-index: 9500; overflow: hidden; background: #07060a url(data:image/webp;base64,UklGRo4AAABXRUJQVlA4IIIAAADQBQCdASooABcAPs1QoUunpKMhtVgIAPAZiWcA0FQWbaljSEYP5OgrxVKncHWIXs4WuZtO8xYgAP70aqRQ0eNrbu5FUqBpLxddWQXx+Pt7wtJ3HOKMdEo3Ip3YyK64aEZRiAKNYwxU2TRgQa4NXVJtMgFd9x+fdfprqrkISGanAAAA) center / cover no-repeat; color: #f0e9dc; opacity: 1; transition: opacity 0.45s ease; }
    .dm-splash.out { opacity: 0; pointer-events: none; }
    .dm-splash-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 38% 50%; opacity: 0; transition: opacity 0.6s ease; }
    .dm-splash-art.in { opacity: 1; }
    .dm-splash-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(7, 6, 10, 0.55) 100%), linear-gradient(to top, rgba(7, 6, 10, 0.92) 0%, rgba(7, 6, 10, 0.55) 26%, transparent 52%); }
    .dm-splash-copy { position: absolute; left: 0; right: 0; bottom: max(9vh, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px; text-align: center; }
    .dm-splash-title { margin: 0; font: 400 clamp(32px, 6.4vw, 72px)/1 Georgia, 'Times New Roman', serif; letter-spacing: 0.16em; text-transform: uppercase; color: #f0e9dc; text-shadow: 0 0 22px rgba(155, 92, 255, 0.55), 0 2px 12px #000; }
    .dm-splash-tag { margin: 0; font: italic 400 clamp(14px, 1.9vw, 22px)/1.3 Georgia, 'Times New Roman', serif; letter-spacing: 0.08em; color: #c6a4ff; text-shadow: 0 1px 8px #000; }
    .dm-splash-track { width: min(340px, 70vw); height: 3px; margin-top: 14px; background: rgba(216, 207, 189, 0.16); border-radius: 2px; overflow: hidden; }
    .dm-splash-bar { height: 100%; width: 100%; transform: scaleX(0.04); transform-origin: left; background: linear-gradient(90deg, #7c3aed, #c6a4ff); box-shadow: 0 0 12px rgba(155, 92, 255, 0.6); transition: transform 0.25s ease-out; }
    .dm-splash-status { font: 400 14px/1.3 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 0.1em; color: rgba(216, 207, 189, 0.8); text-shadow: 0 1px 6px #000; }
    .dm-splash:not(.dm-loadveil) .dm-splash-bar { animation: dm-splash-pulse 2.4s ease-in-out infinite alternate; }
    @keyframes dm-splash-pulse { from { transform: scaleX(0.04); } to { transform: scaleX(0.38); } }
    @media (min-width: 900px) and (min-aspect-ratio: 5/4) { .dm-splash-copy { left: auto; right: 6vw; width: min(46vw, 640px); } }
    @media (prefers-reduced-motion: reduce) { .dm-splash, .dm-splash-art { transition: none; } .dm-splash:not(.dm-loadveil) .dm-splash-bar { animation: none; transform: scaleX(0.3); } }
  </style>
  <link rel="stylesheet" href="/src/ui/ui.css" />
  <link rel="stylesheet" href="/src/ui/readability.css" />
  <link rel="stylesheet" href="/src/ui/mobile.css" />
</head>
<body>
  <div id="dm-splash" class="dm-splash" role="status" aria-label="Loading Death Muffin">
    <img class="dm-splash-art" src="/art/loading/covenant-1600.webp" srcset="/art/loading/covenant-960.webp 960w, /art/loading/covenant-1600.webp 1600w" sizes="100vw" alt="" decoding="async" fetchpriority="high" onload="this.classList.add('in')" />
    <div class="dm-splash-shade"></div>
    <div class="dm-splash-copy">
      <h1 class="dm-splash-title">Death Muffin</h1>
      <p class="dm-splash-tag">Enter the Ossuary Covenant</p>
      <div class="dm-splash-track"><div class="dm-splash-bar"></div></div>
      <div class="dm-splash-status">Loading Death Muffin</div>
    </div>
  </div>
  <canvas id="scene" aria-label="Death Muffin game view"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
