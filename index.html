<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="Death Muffin — a dark fantasy action RPG. Farm the dead, raise your legion, push deeper." />
  <title>Death Muffin</title>
  <script>
    // Phones and tablets (touch-only devices) play the separate mobile build; ?pc=1 opts out. Runs before the game loads.
    (function () {
      try {
        var q = window.matchMedia;
        if (q && q('(pointer: coarse)').matches && !q('(hover: hover)').matches && !/[?&]pc=1(&|$)/.test(location.search) && location.pathname.indexOf('/death-muffin/play/') === 0) {
          location.replace('/death-muffin/mobile/' + location.search + location.hash);
        }
      } catch (e) { /* stay on the PC build */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2307060a'/%3E%3Cpath d='M16 4v24M8 10l8-5 8 5M9 22l7 6 7-6M7 16h18' fill='none' stroke='%239b5cff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c6a4ff'/%3E%3C/svg%3E" />
  <style>
    /* Instant splash: paints from the HTML alone (placeholder, then the painted art), before any module loads. Shared with the in-game
       LoadVeil (src/ui/LoadVeil.ts) so page open -> login -> world is one continuous loading screen. Removed by src/ui/splash.ts. */
    html, body { background: #07060a; }
    .dm-splash { position: fixed; inset: 0; z-index: 9500; overflow: hidden; background: #07060a url(data:image/webp;base64,UklGRrgAAABXRUJQVlA4IKwAAABwBgCdASooABcAPyV8tlKuJ6UiqrgN+cAkiUAXYAob9j0FEZjFVpXS2pKe/53fT1B2z8jrQrwGwPmy2AAA/vVrovbRyjvUceF00kYOPEoWmNty063wKhx24IZQSJ8QgatuMdb1y4EfNcJltSesOh7Cf22WdbVtOzIfc0HG/esuDoPJhfcXJEu9GbcRJdtBw9eR7oqyLFxYgDfjdb3fQy3Kv+WFNlNHTtUGgAAA) center / cover no-repeat; color: #f0e9dc; opacity: 1; transition: opacity 0.45s ease; }
    .dm-splash.out { opacity: 0; pointer-events: none; }
    .dm-splash-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 50%; opacity: 0; transition: opacity 0.6s ease; }
    .dm-splash-art.in { opacity: 1; }
    /* Same composition as the launcher: the hooded necromancer stays right of centre, a dark scrim rises from the bottom and the left. */
    .dm-splash-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 62% 45%, transparent 40%, rgba(7, 6, 10, 0.5) 100%), linear-gradient(to top, rgba(7, 6, 10, 0.94) 0%, rgba(7, 6, 10, 0.6) 24%, transparent 48%), linear-gradient(to right, rgba(7, 6, 10, 0.55) 0%, transparent 42%); }
    .dm-splash-copy { position: absolute; left: 6vw; bottom: max(8vh, env(safe-area-inset-bottom)); width: min(52vw, 560px); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; }
    .dm-splash-title { margin: 0; font: 700 clamp(30px, 5.4vw, 64px)/1 Georgia, 'Times New Roman', serif; letter-spacing: 0.12em; text-transform: uppercase; color: #f0e9dc; text-shadow: 0 0 22px rgba(155, 92, 255, 0.6), 0 0 6px rgba(155, 92, 255, 0.35), 0 2px 12px #000; }
    .dm-splash-tag { margin: 0; font: 400 14px/1.3 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 0.1em; color: #e6c46a; text-shadow: 0 1px 8px #000; }
    .dm-splash-track { width: min(340px, 70vw); height: 3px; margin-top: 8px; background: rgba(44, 34, 62, 0.9); border-radius: 2px; overflow: hidden; }
    .dm-splash-bar { height: 100%; width: 100%; transform: scaleX(0.04); transform-origin: left; background: #c6a4ff; box-shadow: 0 0 12px rgba(155, 92, 255, 0.6); transition: transform 0.25s ease-out; }
    .dm-splash-status { font: italic 400 clamp(13px, 1.4vw, 16px)/1.3 Georgia, 'Times New Roman', serif; letter-spacing: 0.06em; color: rgba(216, 207, 189, 0.75); text-shadow: 0 1px 6px #000; }
    .dm-splash:not(.dm-loadveil) .dm-splash-bar { animation: dm-splash-slide 1.6s ease-in-out infinite alternate; width: 36%; transform: none; }
    @keyframes dm-splash-slide { from { margin-left: 0; } to { margin-left: 64%; } }
    @media (max-aspect-ratio: 1/1) { .dm-splash-copy { left: 6vw; right: 6vw; width: auto; } }
    @media (prefers-reduced-motion: reduce) { .dm-splash, .dm-splash-art { transition: none; } .dm-splash:not(.dm-loadveil) .dm-splash-bar { animation: none; margin-left: 0; } }
  </style>
  <link rel="stylesheet" href="/src/ui/ui.css" />
  <link rel="stylesheet" href="/src/ui/readability.css" />
</head>
<body>
  <div id="dm-splash" class="dm-splash" role="status" aria-label="Loading Death Muffin">
    <img class="dm-splash-art" src="/art/loading/keyart-1600.webp" srcset="/art/loading/keyart-960.webp 960w, /art/loading/keyart-1600.webp 1600w" sizes="100vw" alt="" decoding="async" fetchpriority="high" onload="this.classList.add('in')" />
    <div class="dm-splash-shade"></div>
    <div class="dm-splash-copy">
      <h1 class="dm-splash-title">Death Muffin</h1>
      <p class="dm-splash-tag">Enter the Ossuary Covenant</p>
      <div class="dm-splash-track"><div class="dm-splash-bar"></div></div>
      <div class="dm-splash-status">Loading Death Muffin</div>
    </div>
  </div>
  <canvas id="scene" aria-label="Death Muffin game view"></canvas>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
